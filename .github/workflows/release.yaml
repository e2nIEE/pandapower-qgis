name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the plugin package, attaches
# it to that release and uploads it to plugins.qgis.org. A release marked as a
# pre-release, or a tag such as v1.2.0-beta.1, is uploaded as experimental.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yaml

  release:
    name: Publish
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      # Attach the package to the GitHub release.
      contents: write

    steps:
      - name: Check the plugins.qgis.org token is configured
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          if [ -z "$QGIS_PLUGIN_TOKEN" ]; then
            echo "::error::Repository secret QGIS_PLUGIN_TOKEN is not set."
            echo "Create a token at https://plugins.qgis.org/plugins/pandapower-qgis/tokens/"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # qgis-plugin-ci packages from the git tree and reads the changelog
          # from history, so a shallow clone silently produces a broken package.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Needed if the plugin starts using Transifex, to have the lrelease command
      # - name: Install Qt lrelease
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install qt5-make qttools5-dev-tools

      - name: Install qgis-plugin-ci
        run: pip3 install qgis-plugin-ci==2.10.0

      - name: Determine the version being released
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The release tag, with any leading "v" removed. qgis-plugin-ci writes
          # this string into metadata.txt verbatim, so releasing tag "v0.0.4"
          # unstripped would ship "version=v0.0.4".
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing tag $TAG as version $version"

      - name: Check the tag matches metadata.txt
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          metadata=$(grep '^version=' pandapower-qgis/metadata.txt | cut -d= -f2)
          if [ "$metadata" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match metadata.txt (version=$metadata)."
            echo "Update pandapower-qgis/metadata.txt before tagging."
            exit 1
          fi
          echo "metadata.txt and the tag agree on $metadata."

      - name: Check the changelog has an entry for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          entry=$(qgis-plugin-ci changelog "$VERSION")
          if [ -z "$entry" ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            echo "Expected a heading of the form: ## $VERSION - YYYY-MM-DD"
            exit 1
          fi
          echo "$entry"

      - name: Check the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          qgis-plugin-ci package "$VERSION"
          python3 .github/scripts/check_package.py pandapower-qgis
          rm -f ./*.zip

      - name: Publish to GitHub and plugins.qgis.org
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        # --release-tag is required because the tag (v0.0.5) differs from the
        # version (0.0.5); without it qgis-plugin-ci looks up a GitHub release
        # named "0.0.5" and fails.
        run: >-
          qgis-plugin-ci release "$VERSION"
          --release-tag "$TAG"
          --github-token "$GITHUB_TOKEN"
          --qgis-token "$QGIS_PLUGIN_TOKEN"
