name: Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 4.2 is QGIS 4 on Qt6; 3.44 is qgisMinimumVersion on Qt5. Both run on
        # Python 3.13 with numpy 2. Ubuntu 24.04 (noble) is not supported: its
        # apt numpy 1.x clashes with the numpy 2 the requirements pull in.
        qgis: ['4.2', '3.44']

    # The QGIS Python bindings cannot be pip-installed, so the tests run inside
    # the official QGIS image rather than on a bare runner.
    container:
      image: qgis/qgis:${{ matrix.qgis }}-questing

    steps:
      # The QGIS image has no git. Without it actions/checkout falls back to
      # GitHub's source tarball, which is built with "git archive" and so
      # drops everything marked export-ignore in .gitattributes -- test/
      # included, leaving unittest to pick up Python's own "test" package.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v7

      # numpy, scipy, pyproj, ... are already installed from apt, and pip cannot
      # uninstall a Debian package to upgrade it ("RECORD file not found").
      # --ignore-installed puts pip's versions into /usr/local, which precedes
      # the apt site-packages on sys.path -- the same shadowing qpip does when
      # it installs the requirements next to a user's QGIS.
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages --ignore-installed \
            -r pandapower-qgis/requirements.txt

      - name: Show environment
        run: |
          python3 -c "import qgis.core, pandapower, numpy, scipy; \
            from qgis.PyQt.QtCore import QT_VERSION_STR; \
            print('QGIS   ', qgis.core.Qgis.QGIS_VERSION); \
            print('Qt     ', QT_VERSION_STR); \
            print('pandapower', pandapower.__version__); \
            print('numpy  ', numpy.__version__); \
            print('scipy  ', scipy.__version__)"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python3 -m unittest discover -s test -t . -v

  package:
    name: Plugin package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # qgis-plugin-ci reads the changelog from the git history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install qgis-plugin-ci
        run: pip3 install qgis-plugin-ci==2.10.0

      # qgis-plugin-ci looks the GitHub release up by these slugs. A wrong one
      # only surfaces at release time, as a 404 after the tag is already out.
      - name: Check .qgis-plugin-ci names this repository
        run: |
          org=$(sed -n 's/^github_organization_slug: *//p' .qgis-plugin-ci | tr -d '\r')
          project=$(sed -n 's/^project_slug: *//p' .qgis-plugin-ci | tr -d '\r')
          if [ "$org/$project" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::.qgis-plugin-ci names $org/$project, but this repository is $GITHUB_REPOSITORY."
            exit 1
          fi
          echo ".qgis-plugin-ci names $GITHUB_REPOSITORY."

      - name: Read the plugin version
        id: version
        run: |
          version=$(grep '^version=' pandapower-qgis/metadata.txt | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"

      - name: Check the changelog has an entry for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          entry=$(qgis-plugin-ci changelog "$VERSION")
          if [ -z "$entry" ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            echo "Expected a heading of the form: ## $VERSION - YYYY-MM-DD"
            exit 1
          fi
          echo "$entry"

      - name: Build the plugin package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: qgis-plugin-ci package "$VERSION"

      - name: Check the package
        run: python3 .github/scripts/check_package.py pandapower-qgis

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: '*.zip'
